# OpenAB config — singular [gateway] + [agent].
# See documents/FEAT-1/development/openab-config.md
# render-config.sh expands ${VAR} placeholders at container boot,
# writing the resolved file to /tmp/openab.toml.

[gateway]
url           = "ws://127.0.0.1:8080/ws"
platform      = "line"
token         = "${GATEWAY_TOKEN}"

[agent]
command     = "gemini"
args        = ["--acp"]
working_dir = "/home/node"
env = { HOME = "/home/node", PATH = "/usr/local/bin:/usr/bin:/bin", PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright", GEMINI_API_KEY = "${GEMINI_API_KEY}", GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}", LINE_CHANNEL_ACCESS_TOKEN = "${LINE_CHANNEL_ACCESS_TOKEN}", CF_UPLOAD_SECRET = "${CF_UPLOAD_SECRET}", CF_IMG_BASE_URL = "${CF_IMG_BASE_URL}", GEMINI_TELEMETRY_ENABLED = "true", GEMINI_TELEMETRY_TARGET = "local", GEMINI_TELEMETRY_OUTFILE = "/var/log/openab/gemini-events.jsonl" }

[pool]
max_sessions      = 5
session_ttl_hours = 168

[markdown]
tables = "code"

[reactions]
enabled = false
