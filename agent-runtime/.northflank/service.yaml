apiVersion: v1
kind: CombinedService
metadata:
  name: openab-line-agent
spec:
  source:
    type: docker
    dockerfile: Dockerfile
  resources:
    # nf-compute-100-2 = 1 dedicated vCPU / 2 GB / ~$24/mo
    # (Smaller shared-vCPU SKUs OOM under Chromium; documented in
    # documents/FEAT-1/development/northflank-container.md Step 7.)
    plan: nf-compute-100-2
    replicas: 1
  ports:
    - port: 8080
      protocol: HTTP
      public: true # openab-gateway: LINE webhook + WebSocket
    - port: 8081
      protocol: HTTP
      public: true # Node sidecar: /events/stream + /sessions
  volumes:
    - mountPath: /var/lib/openab/sessions
      size: 1 # GB
  environment:
    LINE_CHANNEL_SECRET: ${secret:line-channel-secret}
    LINE_CHANNEL_ACCESS_TOKEN: ${secret:line-channel-access-token}
    GATEWAY_TOKEN: ${secret:gateway-token}
    # openab-gateway requires at least one platform env to be set; the
    # entrypoint defaults this to a placeholder for LINE-only deploys.
    # Set it via Northflank secret manager only if Telegram is wired up.
    # TELEGRAM_BOT_TOKEN: ${secret:telegram-bot-token}
    LINE_ALLOWED_USER_IDS: ${secret:line-allowed-user-ids}
    GEMINI_API_KEY: ${secret:gemini-api-key}
    GITHUB_TOKEN: ${secret:github-token}
    CF_UPLOAD_SECRET: ${secret:cf-upload-secret}
    CF_IMG_BASE_URL: ${secret:cf-img-base-url}
    DASHBOARD_INGEST_TOKEN: ${secret:dashboard-ingest-token}
