# Gemini CLI Policy Engine (User tier).
# Loaded from ~/.gemini/policies/*.toml; rules merge with the built-in defaults.
# Higher priority wins (0–999 within a tier; User-tier base = 4).
# See documents/FEAT-1/development/gemini-cli-tools.md Step 3b.

# === Shell allowlist — only one script may run ==============================
[[rule]]
toolName      = "run_shell_command"
commandPrefix = "/usr/local/bin/deliver-line-image.sh"
decision      = "allow"
priority      = 800

# Catch-all: every other shell command is rejected (and hidden from the model).
[[rule]]
toolName    = "run_shell_command"
decision    = "deny"
priority    = 100
denyMessage = "Only deliver-line-image.sh is permitted; everything else is hidden."

# === Built-in tools the LINE bot does not need ==============================
[[rule]]
toolName = "web_fetch"
decision = "deny"
priority = 800

[[rule]]
toolName = "web_search"
decision = "deny"
priority = 800

[[rule]]
toolName = "save_memory"
decision = "deny"
priority = 800

# === MCP allowlist ==========================================================
[[rule]]
mcpName  = "playwright"
decision = "allow"
priority = 700

[[rule]]
mcpName  = "github"
decision = "allow"
priority = 700

# Any other MCP server (now or future) is denied by default.
[[rule]]
mcpName     = "*"
decision    = "deny"
priority    = 100
denyMessage = "Only playwright and github MCP servers are whitelisted."
