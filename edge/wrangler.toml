name = "ai-agent-edge-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# === KV namespace for LINE webhookEventId dedup (~10 min TTL) ===
[[kv_namespaces]]
binding = "WEBHOOK_DEDUP"
id      = "53ea62a12b4d4e34aec32d1ff1962085"
preview_id = "862f63a79a2c479b98e9213474af97f1"

# === KV namespace for screenshot hosting (24h TTL) ===
# Replaces what would normally be an R2 bucket. Chosen to avoid R2's
# credit-card requirement on the Cloudflare account. Each screenshot is a
# small (~100KB-1MB) image; KV's 25MB per-value limit and 1GB free-tier
# storage are comfortably more than this use case needs.
[[kv_namespaces]]
binding = "IMG_KV"
id      = "4970d7004f4048828d90aa68356adb5c"
preview_id = "b65a95d265a1452990013153fda8df19"

[vars]
# openab-gateway endpoint — receives /webhook/line forwards from this Worker.
GATEWAY_BASE_URL = "https://openab-line-agent.northflank.app"
# Node sidecar endpoint — receives /events/stream + /sessions proxies.
# Northflank exposes a second port at a separate hostname slot; fill in after deploy.
SIDECAR_BASE_URL = "https://openab-line-agent--8081.northflank.app"
# Origin that hosts the dashboard frontend (Cloudflare Pages).
DASHBOARD_ORIGIN = "https://ai-agent-dashboard.pages.dev"

# === Secrets (set via `wrangler secret put <NAME>`) ===
# LINE_CHANNEL_SECRET    — for X-Line-Signature pre-check at the edge
# LINE_ALLOWED_USER_IDS  — comma-separated allowlist (edge fast-fail)
# CF_UPLOAD_SECRET       — bearer for /img PUT (container -> Worker)
# DASHBOARD_INGEST_TOKEN — bearer for /events/stream + /sessions (Worker -> sidecar)
# DASHBOARD_TOKEN        — bearer the frontend sends on /api/*
